<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CZ 人生节点 · 质押挖矿</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(160deg, #0a0e1a 0%, #101828 45%, #0d1526 100%);
      color: #e5e7eb;
      min-height: 100vh;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 60px; }
    .header { text-align: center; padding: 24px 0 20px; }
    .header .logo { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 40px rgba(255, 184, 0, .35); margin-bottom: 12px; }
    .header h1 { font-size: 26px; font-weight: 800; background: linear-gradient(90deg, #ffb800, #ffd166); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header p { color: #94a3b8; font-size: 13px; margin-top: 6px; }
    .card { background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 18px; margin-top: 14px; }
    .card h3 { font-size: 15px; color: #f1f5f9; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed rgba(255,255,255,.06); }
    .row:last-child { border-bottom: none; }
    .row .k { color: #94a3b8; font-size: 13px; }
    .row .v { font-size: 15px; font-weight: 600; color: #ffd166; }
    .btn {
      display: block; width: 100%; padding: 14px; margin-top: 12px;
      border: none; border-radius: 12px; cursor: pointer;
      font-size: 16px; font-weight: 700; color: #0a0e1a;
      background: linear-gradient(90deg, #ffb800, #ff9500);
      transition: opacity .2s, transform .15s;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn.ghost { background: rgba(255,255,255,.08); color: #e5e7eb; border: 1px solid rgba(255,255,255,.12); }
    input[type=number] {
      width: 100%; padding: 12px 14px; margin-top: 10px;
      background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px; color: #fff; font-size: 18px; outline: none;
    }
    input:focus { border-color: #ffb800; }
    .tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: rgba(255,184,0,.12); color: #ffd166; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .stat { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); border-radius: 12px; padding: 12px; text-align: center; }
    .stat .num { font-size: 20px; font-weight: 800; color: #ffd166; }
    .stat .lbl { font-size: 11px; color: #94a3b8; margin-top: 4px; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1e293b; border: 1px solid #334155; color: #e2e8f0; padding: 12px 20px; border-radius: 10px; font-size: 14px; display: none; z-index: 99; max-width: 90%; }
    .toast.ok { border-color: #22c55e; color: #4ade80; }
    .toast.err { border-color: #ef4444; color: #f87171; }
    .note { font-size: 12px; color: #64748b; margin-top: 10px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <img class="logo" src="/cz-logo.png" alt="CZ" onerror="this.style.display='none'" />
      <h1>CZ 人生节点</h1>
      <p>质押 CZ · 15 天周期 · 节点分红</p>
    </div>

    <div class="card">
      <h3>💰 我的资产</h3>
      <div class="row"><span class="k">钱包地址</span><span class="v" id="addr">未连接</span></div>
      <div class="row"><span class="k">CZ 余额</span><span class="v" id="czBal">--</span></div>
      <div class="row"><span class="k">我的质押</span><span class="v" id="myStaked">--</span></div>
      <div class="row"><span class="k">预估收益</span><span class="v" id="reward">--</span></div>
      <button class="btn" id="connectBtn">连接钱包</button>
    </div>

    <div class="card">
      <h3>🔒 质押 CZ</h3>
      <input type="number" id="amount" placeholder="输入质押数量" min="0" step="any" />
      <button class="btn" id="stakeBtn" disabled>确认质押</button>
      <p class="note">质押锁定 15 天，到期后可提取本金并领取收益。年化约 18.25%。</p>
    </div>

    <div class="stats">
      <div class="stat"><div class="num" id="totalStaked">--</div><div class="lbl">全网质押</div></div>
      <div class="stat"><div class="num" id="nodes">--</div><div class="lbl">节点数量</div></div>
    </div>

    <div class="card">
      <h3>💎 节点分红机制</h3>
      <div class="row"><span class="k">前 10 名</span><span class="v">50%</span></div>
      <div class="row"><span class="k">11-50 名</span><span class="v">30%</span></div>
      <div class="row"><span class="k">51-100 名</span><span class="v">15%</span></div>
      <div class="row"><span class="k">100 名以后</span><span class="v">5%</span></div>
      <p class="note">每 15 天结算一期，开期快照排名，按档位瓜分当期奖池，100% 全部分完。</p>
    </div>

    <div class="card">
      <h3>📄 我的质押记录</h3>
      <div id="records"><p class="note">暂无质押记录</p></div>
      <button class="btn ghost" id="withdrawBtn" disabled>提取本金</button>
      <button class="btn ghost" id="claimBtn" disabled>领取收益</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
